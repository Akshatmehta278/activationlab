name: Bug report
description: Report reproducible incorrect behavior
title: "[Bug]: "
labels: [bug]
body:
  - type: dropdown
    id: profile
    attributes:
      label: Execution profile
      options:
        - Fast local
        - Docker Compose
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Steps to reproduce
      placeholder: "1. Start...\n2. Open...\n3. Submit..."
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior / logs
      description: Remove secrets and personal data before pasting logs.
    validations:
      required: true
