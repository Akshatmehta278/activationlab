name: CI

on:
  push:
    branches: [main, master]
  pull_request:

permissions:
  contents: read

jobs:
  backend:
    name: Backend tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Django checks
        env:
          DJANGO_DEBUG: "0"
          USE_CELERY: "0"
          OPENAI_API_KEY: ""
        run: python manage.py check

      - name: Run tests
        env:
          DJANGO_DEBUG: "0"
          USE_CELERY: "0"
          OPENAI_API_KEY: ""
        run: python manage.py test --verbosity 2

  frontend:
    name: Frontend build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install dependencies
        run: npm install

      - name: Production build
        run: npm run build

  containers:
    name: Container builds
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate Compose
        run: cp .env.example .env && docker compose config >/dev/null

      - name: Build backend image
        run: docker build -t activationlab-backend:ci ./backend

      - name: Build local frontend image
        run: docker build -t activationlab-frontend:ci ./frontend

      - name: Build AWS frontend image
        run: docker build -f frontend/Dockerfile.aws -t activationlab-frontend-aws:ci ./frontend
