services:
  mysql:
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: ${MYSQL_DATABASE:-activationlab}
      MYSQL_USER: ${MYSQL_USER:-activationlab}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-activationlab}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-activationlab-root}
    command: --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-p${MYSQL_ROOT_PASSWORD:-activationlab-root}"]
      interval: 5s
      timeout: 5s
      retries: 20

  redis:
    image: redis:7-alpine
    command: redis-server --appendonly yes
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  rabbitmq:
    image: rabbitmq:4-management-alpine
    ports:
      - "15672:15672"
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 5s
      timeout: 5s
      retries: 20

  backend:
    build: ./backend
    env_file:
      - .env
    environment:
      DB_ENGINE: mysql
      MYSQL_HOST: mysql
      USE_CELERY: "1"
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    volumes:
      - media_data:/app/media
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/health/"]
      interval: 10s
      timeout: 5s
      retries: 20

  worker:
    build: ./backend
    command: celery -A activationlab worker -l INFO --concurrency=2
    env_file:
      - .env
    environment:
      DB_ENGINE: mysql
      MYSQL_HOST: mysql
      USE_CELERY: "1"
    depends_on:
      backend:
        condition: service_healthy
    volumes:
      - media_data:/app/media

  frontend:
    build: ./frontend
    ports:
      - "5173:80"
    depends_on:
      backend:
        condition: service_healthy

volumes:
  mysql_data:
  redis_data:
  rabbitmq_data:
  media_data:
