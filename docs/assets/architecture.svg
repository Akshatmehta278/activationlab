<svg width="1100" height="560" viewBox="0 0 1100 560" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">ActivationLab architecture</title>
  <desc id="desc">React frontend, Django API, MySQL, RabbitMQ, Celery, Redis, and optional AI provider</desc>
  <defs>
    <marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto">
      <path d="M0 0 L9 4.5 L0 9 Z" fill="#64748b"/>
    </marker>
  </defs>
  <rect width="1100" height="560" rx="24" fill="#f8fafc" stroke="#e2e8f0"/>
  <text x="50" y="54" font-family="Inter, ui-sans-serif, system-ui" font-size="24" font-weight="700" fill="#0f172a">Runtime architecture</text>
  <text x="50" y="82" font-family="Inter, ui-sans-serif, system-ui" font-size="14" fill="#64748b">Local Docker profile; managed AWS equivalents are described under infra/terraform.</text>

  <g font-family="Inter, ui-sans-serif, system-ui">
    <rect x="70" y="170" width="190" height="100" rx="18" fill="#eff6ff" stroke="#93c5fd" stroke-width="2"/>
    <text x="165" y="207" text-anchor="middle" font-size="17" font-weight="700" fill="#1e3a8a">React + TypeScript</text>
    <text x="165" y="233" text-anchor="middle" font-size="13" fill="#475569">Vite / Nginx</text>
    <text x="165" y="253" text-anchor="middle" font-size="13" fill="#475569">Onboarding + analytics UI</text>

    <rect x="365" y="150" width="220" height="140" rx="18" fill="#ecfdf5" stroke="#6ee7b7" stroke-width="2"/>
    <text x="475" y="192" text-anchor="middle" font-size="17" font-weight="700" fill="#065f46">Django REST API</text>
    <text x="475" y="219" text-anchor="middle" font-size="13" fill="#475569">Domain services</text>
    <text x="475" y="240" text-anchor="middle" font-size="13" fill="#475569">Event instrumentation</text>
    <text x="475" y="261" text-anchor="middle" font-size="13" fill="#475569">Experiment analytics</text>

    <rect x="720" y="105" width="180" height="90" rx="18" fill="#fff7ed" stroke="#fdba74" stroke-width="2"/>
    <text x="810" y="142" text-anchor="middle" font-size="17" font-weight="700" fill="#9a3412">MySQL</text>
    <text x="810" y="165" text-anchor="middle" font-size="13" fill="#475569">Transactional source of truth</text>

    <rect x="720" y="235" width="180" height="90" rx="18" fill="#fff7ed" stroke="#fb923c" stroke-width="2"/>
    <text x="810" y="272" text-anchor="middle" font-size="17" font-weight="700" fill="#9a3412">RabbitMQ</text>
    <text x="810" y="295" text-anchor="middle" font-size="13" fill="#475569">Import task broker</text>

    <rect x="720" y="365" width="180" height="90" rx="18" fill="#faf5ff" stroke="#c084fc" stroke-width="2"/>
    <text x="810" y="402" text-anchor="middle" font-size="17" font-weight="700" fill="#6b21a8">Celery Worker</text>
    <text x="810" y="425" text-anchor="middle" font-size="13" fill="#475569">Async CSV processing</text>

    <rect x="945" y="365" width="120" height="90" rx="18" fill="#fef2f2" stroke="#fca5a5" stroke-width="2"/>
    <text x="1005" y="402" text-anchor="middle" font-size="17" font-weight="700" fill="#991b1b">Redis</text>
    <text x="1005" y="425" text-anchor="middle" font-size="12" fill="#475569">Task results</text>

    <rect x="365" y="370" width="220" height="90" rx="18" fill="#f5f3ff" stroke="#a78bfa" stroke-width="2"/>
    <text x="475" y="407" text-anchor="middle" font-size="17" font-weight="700" fill="#5b21b6">AI Recommendation Layer</text>
    <text x="475" y="430" text-anchor="middle" font-size="12" fill="#475569">Rules fallback + optional server API</text>
  </g>

  <g stroke="#64748b" stroke-width="2" fill="none" marker-end="url(#arrow)">
    <path d="M260 220 H355"/>
    <path d="M585 190 C640 190 655 150 710 150"/>
    <path d="M585 240 C640 240 655 280 710 280"/>
    <path d="M810 325 V355"/>
    <path d="M900 410 H935"/>
    <path d="M475 290 V360"/>
    <path d="M720 410 C655 410 650 265 585 265"/>
  </g>

  <g font-family="Inter, ui-sans-serif, system-ui" font-size="12" fill="#64748b">
    <text x="300" y="208">HTTPS / JSON</text>
    <text x="625" y="132">read/write</text>
    <text x="625" y="292">enqueue</text>
    <text x="822" y="345">consume</text>
    <text x="910" y="398">results</text>
    <text x="486" y="333">advisory only</text>
  </g>
</svg>
